jqassistant:
  store:
    embedded:
      # The analysis rules use apoc.text.indexOf. Previously the APOC jars were
      # copied into <store>/plugins by hand, which a FRESH store does not have --
      # and every nightly run now builds a fresh store, so analyze failed with
      # "Unknown function 'apoc.text.indexOf'". jQAssistant provides APOC itself
      # when asked.
      apoc-enabled: true
      # NO slow-query log here, deliberately -- see the negative result in
      # docs/modules/arc42/pages/performance-findings.adoc. Neo4j's
      # db.logs.query.* settings are an Enterprise feature and are silently
      # ignored by the Community edition jQAssistant embeds, so configuring
      # them only creates the illusion of observability. Both hot spots found
      # so far (an unbounded "-[*]->" traversal and a missing index on
      # Commit.sha) were located by thread sampling and EXPLAIN instead.
  repositories:
    remotes:
      github-ascheman:
        url: https://maven.pkg.github.com/ascheman/jqa-groovy-plugin
        username: THIS-DOES-NOT-MATTER
        password: ${GITHUB_TOKEN}
        releases:
          enabled: false
        snapshots:
          enabled: true
  plugins:
    - group-id: net.aschemann.jqassistant.plugins
      artifact-id: jqa-groovy-plugin
      version: 0.2.0-SNAPSHOT
    - group-id: net.aschemann.jqassistant.plugins
      artifact-id: jqa-github-config-plugin
      version: 0.1.1-SNAPSHOT
    - group-id: de.kontext-e.jqassistant.plugin
      artifact-id: jqassistant.plugin.git
      version: 2.4.3-SNAPSHOT
  scan:
    continue-on-error: true
    # We need this with the Maven scanner as it only scans target/ by default
    include:
      files:
        - .git
        # GitHub Actions workflows and the rest of .github/, read by the
        # github-config plugin. Without this the directory scanner never
        # descends into it and the plugin sees nothing.
        - .github
    properties:
      directory.follow-symbolic-links: true
      maven3.dependencies.scan: true
  analyze:
    groups:
      # FIRST, deliberately: folds the artifact nodes that share a Maven
      # coordinate into one. A scan creates one node per FILE, so every isolated
      # local repository under .m2-isolated contributes a second copy of the same
      # Central artifact -- and the class-level content sits on only one of them.
      # The report groups below count usage per artifact, so they have to see the
      # folded graph, not the duplicated one. Measured: jQAssistant does execute
      # the groups in the order configured here. It is not guaranteed anywhere,
      # though, and the report concepts do not declare a requiresConcept on
      # maven:SingleArtifactPerCoordinate -- so this ordering is observed
      # behaviour, not an invariant.
      - maven-artifact-identity
      - default
      # Wires each artifact's placeholder types into the scanned JDK's
      # hierarchy; without it EXTENDS* stops at the JDK boundary.
      - jdk
      - dependency-reports
      - external-dependency-scm
    rule:
      directory: jqassistant/rules/
    report:
      fail-on-severity: blocker