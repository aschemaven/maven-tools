# Manual SCM URL overrides for dependencies where automated lookup fails.
# Format: group\:artifact = https://...  (colon must be escaped with backslash)
# Use NONE for artifacts with no known source repository.

# Apache HttpComponents (old 4.x coordinates)
org.apache.httpcomponents\:httpclient = https://github.com/apache/httpcomponents-client
org.apache.httpcomponents\:httpcore = https://github.com/apache/httpcomponents-core

# Apache Groovy (monorepo)
org.apache.groovy\:groovy = https://github.com/apache/groovy
org.apache.groovy\:groovy-json = https://github.com/apache/groovy
org.apache.groovy\:groovy-templates = https://github.com/apache/groovy
org.apache.groovy\:groovy-xml = https://github.com/apache/groovy
org.apache.groovy\:groovy-yaml = https://github.com/apache/groovy

# Apache MINA SSHD (monorepo)
org.apache.sshd\:sshd-common = https://github.com/apache/mina-sshd
org.apache.sshd\:sshd-core = https://github.com/apache/mina-sshd
org.apache.sshd\:sshd-git = https://github.com/apache/mina-sshd
org.apache.sshd\:sshd-scp = https://github.com/apache/mina-sshd
org.apache.sshd\:sshd-sftp = https://github.com/apache/mina-sshd

# Apache MINA
org.apache.mina\:mina-core = https://github.com/apache/mina

# Apache FTP Server
org.apache.ftpserver\:ftpserver-core = https://github.com/apache/mina-ftpserver

# Apache Ivy
org.apache.ivy\:ivy = https://github.com/apache/ant-ivy

# Apache Maven resources
org.apache.apache.resources\:apache-incubator-disclaimer-resource-bundle = https://github.com/apache/maven-apache-resources
org.apache.apache.resources\:apache-jar-resource-bundle = https://github.com/apache/maven-apache-resources
org.apache.apache.resources\:apache-jar-txt-resource-bundle = https://github.com/apache/maven-apache-resources

# Java EE / legacy
javax.servlet\:servlet-api = https://github.com/javaee/servlet-spec
aopalliance\:aopalliance = https://github.com/hoverruan/aopalliance

# No known source repository
it.could\:webdav = NONE
